name: Update benchmarks

# Weeknights after the US close: refresh the daily benchmark levels that
# /books/ compares each book against (books/data/benchmarks.json).
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_benchmarks.py
      - name: Commit changes
        run: |
          git add books/data/benchmarks.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git commit -m "Books: update benchmarks"
            git push
          fi
